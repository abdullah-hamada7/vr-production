<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tele-rehabilitation </title>
  <meta name="description" content="Clinical-Grade AI feedback for home-based physiotherapy." />
  <!-- Medical font: Playfair Display for headings, DM Sans for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Material Icons for Medical UI -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- MediaPipe dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <!-- Splash Screen Critical CSS -->
  <style>
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: splashFadeOut 0.6s ease 2.5s forwards;
    }

    .splash-wallpaper {
      position: absolute;
      inset: 0;
      background:
        url('https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=800&q=80') center/cover no-repeat,
        linear-gradient(135deg, #0D1420 0%, #1A2332 50%, #0066B3 100%);
    }

    .splash-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
          rgba(10, 15, 30, 0.3) 0%,
          rgba(10, 15, 30, 0.5) 50%,
          rgba(10, 15, 30, 0.8) 100%);
    }

    @keyframes splashFadeOut {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        pointer-events: none;
      }
    }

    .splash-bg-pattern {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0, 102, 179, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 166, 126, 0.08) 0%, transparent 40%);
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 2rem;
      position: relative;
      z-index: 10;
    }

    .splash-logo-container {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-shield {
      width: 70px;
      height: 70px;
      background: linear-gradient(145deg, #0066B3, #004A87);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 102, 179, 0.4);
    }

    .medical-cross {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .medical-cross .cross-h,
    .medical-cross .cross-v {
      position: absolute;
      background: white;
      border-radius: 2px;
    }

    .medical-cross .cross-h {
      width: 24px;
      height: 4px;
    }

    .medical-cross .cross-v {
      width: 4px;
      height: 24px;
    }

    .splash-pulse-rings {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-ring {
      position: absolute;
      border: 2px solid #00A67E;
      border-radius: 20px;
      opacity: 0;
      animation: ringPulse 2s ease-out infinite;
    }

    .ring-1 {
      width: 80px;
      height: 80px;
    }

    .ring-2 {
      width: 90px;
      height: 90px;
      animation-delay: 0.4s;
    }

    .ring-3 {
      width: 100px;
      height: 100px;
      animation-delay: 0.8s;
    }

    @keyframes ringPulse {
      0% {
        transform: scale(0.8);
        opacity: 0.8;
      }

      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }

    .splash-brand {
      text-align: center;
    }

    .splash-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 3rem;
      font-weight: 800;
      color: #FFFFFF;
      margin: 0;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      letter-spacing: -0.02em;
    }

    .splash-title .accent {
      color: #00FF88;
    }

    .splash-tagline {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.95);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .splash-loading .loading-text {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .splash-certifications .cert-item {
      background: rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.3);
      font-weight: 700;
    }

    .splash-certifications .cert-icon {
      color: #00FF88;
      font-weight: 800;
    }

    .splash-footer .copyright {
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
    }

    .splash-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .loading-medical {
      width: 200px;
      height: 6px;
      background: #E8EDF2;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .loading-progress-bar {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #00FF88, #00CCFF, #00FF88);
      border-radius: 3px;
      animation: loadingMove 1.2s ease-in-out infinite;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
    }

    @keyframes loadingMove {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(400%);
      }
    }

    .loading-dots {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .loading-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00FF88;
      animation: dotPulse 1.4s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    .loading-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dotPulse {

      0%,
      80%,
      100% {
        transform: scale(0.6);
        opacity: 0.5;
      }

      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    .loading-text {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
    }

    .loading-text .material-icons {
      font-size: 1rem;
      animation: hourglassSpin 2s linear infinite;
      color: #00FF88;
    }

    @keyframes hourglassSpin {

      0%,
      100% {
        transform: rotateY(0deg);
      }

      50% {
        transform: rotateY(180deg);
      }
    }

    .splash-certifications {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .cert-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.85rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
      backdrop-filter: blur(5px);
    }

    .cert-icon {
      color: #00A67E;
      font-weight: 700;
    }

    .splash-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .footer-line {
      width: 150px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 102, 179, 0.3), transparent);
    }

    .copyright {
      font-size: 0.65rem;
      color: #8E99A8;
    }
  </style>
</head>

<body>
  <!-- Clinical Splash Screen -->
  <div id="splash-screen">
    <div class="splash-wallpaper"></div>
    <div class="splash-overlay"></div>
    <div class="splash-bg-pattern"></div>
    <div class="splash-content">
      <div class="splash-logo-container">
        <div class="splash-shield">
          <div class="medical-cross">
            <span class="cross-h"></span>
            <span class="cross-v"></span>
          </div>
        </div>
        <div class="splash-pulse-rings">
          <div class="pulse-ring ring-1"></div>
          <div class="pulse-ring ring-2"></div>
          <div class="pulse-ring ring-3"></div>
        </div>
      </div>
      <div class="splash-brand">
        <h1 class="splash-title">Tele<span class="accent">Rehabilitation</span></h1>
        <p class="splash-tagline">patients can perform exercises at home while AI monitors their form in real-time</p>
      </div>
      <div class="splash-loading">
        <div class="loading-medical">
          <div class="loading-progress-bar"></div>
        </div>
        <div class="loading-dots">
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
          <div class="loading-dot"></div>
        </div>
        <span class="loading-text">Initializing Systems...</span>
      </div>
      <div class="splash-certifications">
        <div class="cert-item">
          <span class="cert-icon">✚</span>
          <span class="cert-text">FDA Registered</span>
        </div>
        <div class="cert-item">
          <span class="cert-icon">◉</span>
          <span class="cert-text">ISO 13485</span>
        </div>
        <div class="cert-item">
          <span class="cert-icon">✓</span>
          <span class="cert-text">CE Certified</span>
        </div>
      </div>
      <div class="splash-footer">
        <div class="footer-line"></div>
        <span class="copyright">© 2026 Tele-rehabilitation Medical Systems • All Rights Reserved</span>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
